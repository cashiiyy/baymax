version: '3.8'

services:
  baymax-server:
    build: .
    container_name: baymax_server
    ports:
      - "8080:8080"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TAILSCALE_IP=100.89.251.123
      - AE2_TAILSCALE_IP=100.79.169.64
      - AE2_BASE_URL=http://100.79.169.64:8001
      - BIOMISTRAL_BASE_URL=http://100.79.169.64:1234
      - BAYMAX_DB_PATH=/app/data/baymax.db
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: baymax_nginx
    ports:
      - "8081:80"   # host:8081 → nginx:80  (avoids conflict with any existing :80 service)
    volumes:
      - ./nginx/baymax.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - baymax-server
    restart: unless-stopped
